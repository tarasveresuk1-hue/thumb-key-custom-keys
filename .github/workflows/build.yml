name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk thumb-key-custom.apk
      - name: Move latest tag
        run: |
          git tag -f latest
          git push -f origin latest
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Thumb-Key Custom
          files: thumb-key-custom.apk
